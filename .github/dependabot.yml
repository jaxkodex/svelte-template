version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      svelte:
        patterns:
          - "@sveltejs/*"
          - "svelte"
      tailwind:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
