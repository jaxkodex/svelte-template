name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use the workflow from the default branch; never check out PR code here.
      - name: Merge pull requests that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pull_requests=$(gh api --paginate --slurp "repos/$GH_REPO/commits/$HEAD_SHA/pulls?per_page=100" |
            jq -r --arg sha "$HEAD_SHA" '.[][] | select(.state == "open" and .base.ref == "main" and .draft == false and .head.sha == $sha) | .number')

          while IFS= read -r pr; do
            if [ -n "$pr" ]; then
              gh pr merge "$pr" --auto --squash --match-head-commit "$HEAD_SHA"
            fi
          done <<< "$pull_requests"
